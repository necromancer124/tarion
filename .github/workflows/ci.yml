name: CI

on:
  push:
    branches: [client]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -count=1 -race ./...
      - name: build client and server
        run: |
          go build -o out/ .
          go build -o out/ ./server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tariond:ci .
      - name: image starts and can write its data volume
        run: docker run --rm tariond:ci id
